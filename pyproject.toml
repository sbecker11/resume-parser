[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-parser"
version = "1.0.0"
description = "Parse resume documents (DOCX/PDF) into flock-of-postcards JSON and HTML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
urls = { Repository = "https://github.com/sbecker11/resume-parser" }
dependencies = [
  "python-docx>=1.0.0",
  "pdfplumber>=0.10.0",
  "anthropic>=0.18.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "Jinja2>=3.0.0",
  "markupsafe>=2.0",
  "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.0.0",
  "pytest>=7.0.0",
]

[project.scripts]
resume-to-flock = "resume_parser.resume_to_flock:main"
render-resume-html = "resume_parser.render_resume_html:main"
run-merge-on-parsed = "resume_parser.run_merge_on_parsed:main"
validate-parsed-resume = "resume_parser.contracts.validate_parsed_resume:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_parser = [
  "contracts/*.json",
  "contracts/*.md",
  "contracts/requirements.txt",
  "templates/*.html",
]
